<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Notes</title>
<style>
:root{--bg:#0b0d10;--panel:#14171c;--line:#222730;--text:#e7eaee;--dim:#7d8590;--me:#2b5cff;--them:#1b2027;--ok:#2ecc71}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
.screen{display:none;height:100%}.screen.on{display:flex}
#lobby{align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.card h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.card p{color:var(--dim);font-size:13px}
.btn{background:var(--me);border:0;border-radius:12px;padding:13px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--panel);border:1px solid var(--line)}
.row{display:flex;gap:8px}
input.code{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;text-transform:uppercase;letter-spacing:.25em;text-align:center;outline:none}
input.code:focus,#txt:focus{border-color:var(--me)}
#chat{flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#title{flex:1;min-width:0}#title b{display:block;font-size:14px}#title small{color:var(--dim);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{background:none;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;opacity:.6}.ic.act{opacity:1;border-color:var(--me)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--them);align-self:flex-start;word-wrap:break-word;transition:opacity .5s;animation:in .15s}
.m.me{background:var(--me);align-self:flex-end}
.m .n{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}.m.me .n{display:none}
.m img{max-width:100%;border-radius:10px;display:block;filter:blur(14px);cursor:pointer;transition:filter .2s}.m img.show{filter:none}
.m.gone{opacity:0}
.sys{align-self:center;color:var(--dim);font-size:12px}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
#typing{height:20px;padding:0 16px;font-size:12px;color:var(--dim)}
form{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
#txt{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:10px 14px;outline:none}
form .ic{border-radius:50%;width:40px;height:40px;opacity:1}
#send{background:var(--me);border-color:var(--me)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="lobby" class="screen on">
  <div class="card">
    <h1>Private room</h1>
    <p>Nothing is saved. Messages vanish after they are seen. Close the tab and everything is gone.</p>
    <button class="btn" id="create">Create room</button>
    <div class="row"><input class="code" id="codeIn" maxlength="6" placeholder="CODE" autocomplete="off"><button class="btn ghost" id="join">Join</button></div>
    <p id="err" style="color:#ff6b6b"></p>
  </div>
</section>

<section id="chat" class="screen">
  <header>
    <span class="dot" id="dot"></span>
    <div id="title"><b id="roomCode"></b><small id="who"></small></div>
    <button class="ic" id="vBtn" title="Vanish after seen">⏳</button>
    <button class="ic" id="nBtn" title="Notifications">🔔</button>
    <button class="ic" id="pBtn" title="Panic (Esc)">✕</button>
  </header>
  <div id="msgs"></div>
  <div id="typing"></div>
  <form id="f">
    <button type="button" class="ic" id="imgBtn">＋</button>
    <input id="txt" placeholder="Message" autocomplete="off">
    <button class="ic" id="send">➤</button>
    <input type="file" id="file" accept="image/*" hidden>
  </form>
</section>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s), PRE='cr9x-', VANISH_MS=15000;
const A=['Silent','Neon','Cosmic','Misty','Shadow','Lucky','Frozen','Velvet','Rapid','Hidden'], B=['Fox','Panda','Owl','Wolf','Tiger','Koala','Falcon','Otter','Lynx','Raven'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
let me=pick(A)+pick(B), peer, isHost=false, conns={}, hostConn=null, roster={}, vanish=true, notif=false, pending=[], typTimer={}, myTyping=false, code='';

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('')}

// ---------- connect ----------
function createRoom(){
  code=genCode(); isHost=true;
  peer=new Peer(PRE+code);
  peer.on('error',e=>{ if(e.type==='unavailable-id')createRoom(); else $('#err').textContent='Server error, try again.' });
  peer.on('open',()=>{roster.host=me;enter()});
  peer.on('connection',c=>{
    c.on('open',()=>{ if(Object.keys(conns).length>=4){c.send({t:'full'});setTimeout(()=>c.close(),300)} });
    c.on('data',d=>hostRecv(c,d));
    c.on('close',()=>{ if(!roster[c.peer])return; const n=roster[c.peer]; delete roster[c.peer]; delete conns[c.peer]; out({t:'sys',text:n+' left'}); sysLine(n+' left'); pushRoster() });
  });
}
function joinRoom(c){
  code=c.toUpperCase().trim(); if(code.length!==6)return $('#err').textContent='Enter the 6-letter code.';
  $('#err').textContent='Connecting…';
  peer=new Peer();
  peer.on('error',e=>{$('#err').textContent=e.type==='peer-unavailable'?'Room not found. Check the code.':'Connection failed. Try again.'});
  peer.on('open',()=>{
    hostConn=peer.connect(PRE+code,{reliable:true});
    hostConn.on('open',()=>{hostConn.send({t:'hello',name:me});enter()});
    hostConn.on('data',handle);
    hostConn.on('close',()=>{sysLine('Room closed');$('#dot').classList.remove('on')});
  });
}
function hostRecv(c,d){
  if(d.t==='hello'){ conns[c.peer]=c; roster[c.peer]=d.name; const t='sys'; sysLine(d.name+' joined'); relay({t,text:d.name+' joined'},c.peer); pushRoster(); return }
  handle(d); relay(d,c.peer);
}
function relay(d,except){Object.entries(conns).forEach(([id,c])=>{if(id!==except&&c.open)c.send(d)})}
function out(d){ if(isHost)relay(d); else if(hostConn&&hostConn.open)hostConn.send(d) }
function pushRoster(){const list=Object.values(roster);setOnline(list);relay({t:'roster',list})}

// ---------- receive ----------
function handle(d){
  if(d.t==='msg'){addMsg(d,false); if(document.hidden){pending.push(d.id);ping()}else seen(d.id)}
  else if(d.t==='typing'){typingShow(d)}
  else if(d.t==='seen'){const el=document.getElementById(d.id); if(el)schedule(el)}
  else if(d.t==='roster'){setOnline(d.list)}
  else if(d.t==='sys'){sysLine(d.text)}
  else if(d.t==='full'){$('#err').textContent='Room is full.';show('lobby')}
}
function seen(id){out({t:'seen',id});const el=document.getElementById(id);if(el)schedule(el)}
function schedule(el){ if(!vanish||el.dataset.s)return; el.dataset.s=1; setTimeout(()=>{el.classList.add('gone');setTimeout(()=>el.remove(),500)},VANISH_MS) }
function setOnline(list){const others=list.filter(n=>n!==me);$('#dot').classList.toggle('on',others.length>0);$('#who').textContent=others.length?others.join(', ')+' · online':'Waiting for someone…'}
function typingShow(d){
  const t=$('#typing'); if(d.on){t.textContent=d.name+' is typing…';clearTimeout(typTimer.x);typTimer.x=setTimeout(()=>t.textContent='',3000)} else t.textContent='';
}
function ping(){ if(notif&&'Notification' in window&&Notification.permission==='granted'){new Notification('New message',{silent:false})} }

// ---------- UI ----------
function enter(){ show('chat'); $('#roomCode').textContent='Room '+code; setOnline(Object.values(roster)); sysLine(isHost?'Share the code '+code+' with your friend.':'You are '+me); $('#txt').focus() }
function sysLine(t){const e=document.createElement('div');e.className='sys';e.textContent=t;$('#msgs').append(e);scroll()}
function scroll(){const m=$('#msgs');m.scrollTop=m.scrollHeight}
function addMsg(d,mine){
  const e=document.createElement('div');e.className='m'+(mine?' me':'');e.id=d.id;
  const n=document.createElement('span');n.className='n';n.textContent=d.name;e.append(n);
  if(d.img){const i=new Image();i.src=d.img;i.onclick=()=>i.classList.toggle('show');e.append(i)}
  if(d.text){const s=document.createElement('span');s.textContent=d.text;e.append(s)}
  $('#msgs').append(e);scroll();
}
function sendMsg(extra){
  const text=$('#txt').value.trim(); if(!text&&!extra)return;
  const d={t:'msg',id:'m'+Date.now()+Math.random().toString(36).slice(2,6),name:me,text,...extra};
  addMsg(d,true); if(d.img)document.getElementById(d.id).querySelector('img').classList.add('show');
  out(d); $('#txt').value=''; stopTyping();
}
function stopTyping(){if(myTyping){myTyping=false;out({t:'typing',name:me,on:false})}}
$('#txt').addEventListener('input',()=>{
  if(!myTyping){myTyping=true;out({t:'typing',name:me,on:true})}
  clearTimeout(typTimer.me);typTimer.me=setTimeout(stopTyping,1500);
});
$('#f').addEventListener('submit',e=>{e.preventDefault();sendMsg()});
$('#imgBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    sendMsg({img:c.toDataURL('image/jpeg',.7)});
  };im.src=r.result};r.readAsDataURL(f);e.target.value='';
};
$('#vBtn').classList.add('act');
$('#vBtn').onclick=()=>{vanish=!vanish;$('#vBtn').classList.toggle('act',vanish);sysLine('Vanish after seen: '+(vanish?'on':'off'))};
$('#nBtn').onclick=async()=>{
  if(!('Notification' in window))return sysLine('Notifications not supported here.');
  if(!notif){ if(Notification.permission!=='granted')await Notification.requestPermission(); notif=Notification.permission==='granted'; if(!notif)sysLine('Allow notifications in browser settings.') } else notif=false;
  $('#nBtn').classList.toggle('act',notif);
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pending.forEach(seen);pending=[]}});
function panic(){try{peer&&peer.destroy()}catch(e){} document.body.innerHTML='';location.replace('https://www.google.com')}
$('#pBtn').onclick=panic;
document.addEventListener('keydown',e=>{if(e.key==='Escape')panic()});
$('#create').onclick=createRoom;
$('#join').onclick=()=>joinRoom($('#codeIn').value);
$('#codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom($('#codeIn').value)});
if(location.hash.length===7)$('#codeIn').value=location.hash.slice(1);
</script>
</body>
</html>
